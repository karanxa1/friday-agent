# Friday — single-host deploy (Caddy TLS + backend + web).
# Caddy terminates HTTPS for otpgod.com (auto Let's Encrypt) and proxies to web.
# friday.env is generated at deploy time (gitignored, secrets).
services:
  backend:
    build: ./friday
    env_file: ./friday.env
    environment:
      - PORT=8080
      - FRIDAY_BROWSER_HEADLESS=1
    volumes:
      - friday-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./web
    environment:
      - FRIDAY_API=http://backend:8080
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  friday-data:
  caddy-data:
  caddy-config:
