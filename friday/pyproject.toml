[project]
name = "friday"
version = "0.1.0"
description = "Friday: a self-modifying, self-learning autonomous agent (ADK + local Claude + MCP)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk[extensions]==2.2.0",
    "mcp>=1.0.0",
    "litellm>=1.50.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "cryptography>=43.0",
    "playwright>=1.50",
    "pyautogui>=0.9.54",
    "markdown>=3.5",
    "fpdf2>=2.7",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "graphviz>=0.20",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "skills", "curator", "memory", "delegate", "self_dev", "capability", "auth", "sandbox", "mcp_tools", "domains", "control_plane"]
